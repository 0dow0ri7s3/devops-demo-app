name: Full CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test Runner
        run: echo "Runner OK"

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-demo-app:v1 .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-demo-app:v1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker stop demo-app || true
            docker rm demo-app || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/devops-demo-app:v1
            docker run -d -p 3000:3000 --name demo-app ${{ secrets.DOCKER_USERNAME }}/devops-demo-app:v1
